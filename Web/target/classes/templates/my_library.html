<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>A Minha Biblioteca - Open Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: menu_superior}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bookmarks me-2 text-primary"></i>A Minha Biblioteca</h2>
        <a th:href="@{/articles/search}" class="btn btn-outline-secondary btn-sm">Explorar mais artigos</a>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/articles/my-library}" method="get" class="row g-3">

                <div class="col-md-5">
                    <label class="form-label small fw-bold">Filtrar por Temática</label>
                    <select name="thematic" class="form-select">
                        <option value="">Todas as minhas temáticas</option>
                        <option th:each="t : ${allThematics}"
                                th:value="${t.idThematic}"
                                th:text="${t.description}"
                                th:selected="${t.idThematic == lastThematic}"></option>
                    </select>
                </div>

                <div class="col-md-5">
                    <label class="form-label small fw-bold">Filtrar por Autor</label>
                    <select name="author" class="form-select">
                        <option value="">Todos os meus autores</option>
                        <option th:each="auth : ${allAuthors}"
                                th:value="${auth.user.idUser}"
                                th:text="${auth.user.name}"
                                th:selected="${auth.user.idUser == lastAuthor}"></option>
                    </select>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i>Filtrar</button>
                </div>
            </form>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(purchases)}" class="alert alert-info text-center shadow-sm py-4">
        <i class="bi bi-info-circle fs-3 d-block mb-2 text-secondary"></i>
        <p class="mb-0 fw-bold">Nenhum artigo encontrado com os filtros selecionados.</p>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(purchases)}">
        <div class="col-md-6 col-lg-4" th:each="p : ${purchases}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">

                    <div class="mb-2">
                    <span th:each="t : ${p.article.thematics}"
                          class="badge bg-secondary me-1"
                          th:text="${t.description}">Temática</span>
                    </div>

                    <h5 class="card-title fw-bold text-dark" th:text="${p.article.title}">Título do Artigo</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${p.article.resume}">Resumo...</p>

                    <div class="mt-2 pt-2 border-top">
                        <small class="text-muted d-block">Autores: <span class="fw-bold text-dark" th:text="${p.article.displayAuthors}">Autores</span></small>
                    </div>
                </div>

                <div class="card-footer bg-white border-0 d-grid gap-2 pb-3">
                    <a th:href="@{/articles/view-pdf/{id}(id=${p.article.idArticle})}"
                       class="btn btn-danger" target="_blank">
                        <i class="bi bi-file-pdf me-2"></i>Ver PDF
                    </a>
                    <a th:href="@{/articles/details/{id}(id=${p.article.idArticle})}"
                       class="btn btn-link btn-sm text-decoration-none text-muted">Ver Detalhes do Artigo</a>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
