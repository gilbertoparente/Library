<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="menu_superior" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-book-half me-2"></i>Open Library
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/articles/search}">Pesquisar Artigos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/articles/my-library}">
                        <i class="bi bi-bookmarks me-1"></i>Minha Biblioteca
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/profile}">Meu Perfil</a>
                </li>
            </ul>

            <div class="d-flex align-items-center">
                <span class="text-light me-3 small" th:if="${session.loggedUser != null}">
                    Olá, <span th:text="${session.loggedUser.name}">Utilizador</span>
                </span>
                <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Sair</a>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
