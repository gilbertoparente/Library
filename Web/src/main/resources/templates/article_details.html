<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">Detalhes do Artigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: menu_superior}"></div>

<div class="container py-4">
    <div class="row g-5">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4 mb-4">
                <h1 class="fw-bold mb-3" th:text="${article.title}">Título</h1>
                <div class="mb-4">
                    <span class="badge bg-primary me-2" th:each="thematic : ${article.thematics}" th:text="${thematic.description}">Temática</span>
                </div>
                <h5 class="fw-bold border-bottom pb-2">Resumo</h5>
                <p class="text-secondary" style="text-align: justify; line-height: 1.6;" th:text="${article.resume}"></p>
                <div class="mt-4">
                    <h6 class="fw-bold text-muted">Palavras-chave:</h6>
                    <p th:text="${article.keywords}"></p>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-chat-dots me-2"></i>Comentários</h5>

                <div th:if="${session.loggedUser != null and hasAccess}" class="mb-4">
                    <form th:action="@{/articles/details/{id}/comment(id=${article.idArticle})}" method="post">
                        <textarea name="content" class="form-control mb-2" rows="3" required placeholder="Escreva o seu comentário..."></textarea>
                        <button type="submit" class="btn btn-primary btn-sm">Publicar</button>
                    </form>
                </div>

                <div th:each="c : ${comments}" class="border-bottom py-2">
                    <strong th:text="${c.user.name}"></strong> <small class="text-muted" th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    <p th:text="${c.content}"></p>
                </div>
                <div th:if="${#lists.isEmpty(comments)}" class="text-muted">Ainda não há comentários.</div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 sticky-top" style="top: 20px;">
                <h5 class="fw-bold mb-4">Informação Técnica</h5>
                <th:block th:if="${article.price > 0}">
                    <a th:href="@{/articles/buy/{id}(id=${article.idArticle})}" class="btn btn-success btn-lg shadow-sm">
                        <i class="bi bi-cart-check me-2"></i>Comprar Artigo
                    </a>
                </th:block>
            </div>
        </div>
    </div>
</div>
</body>
</html>
